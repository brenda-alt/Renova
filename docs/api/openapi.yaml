        items:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionMedication"
        referenceDate:
          type: string
          format: date
          description: Data corrente usada no cálculo, no fuso informado.
        timezone:
          type: string
          example: America/Sao_Paulo
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PrescriptionCreateRequest:
      type: object
      additionalProperties: false
      required: [patientId]
      properties:
        patientId:
          type: string
          description: Inteiro do banco em texto decimal. Não é UUID.
          pattern: '^[1-9][0-9]*$'
        expiresOn:
          type: string
          format: date
          nullable: true
          description: |
            Quando omitido ou nulo, a receita fica pendente de informação.
        notes:
          type: string
          maxLength: 2000
          description: Observação operacional. Evitar diagnóstico ou dado clínico livre.
        prescriptionType:
          $ref: "#/components/schemas/PrescriptionType"
        issuedOn:
