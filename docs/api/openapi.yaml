      properties:
        vencidas:
          type: integer
          minimum: 0
        proximas5:
          type: integer
          minimum: 0
        proximas15:
          type: integer
          minimum: 0
        dentroDoPrazo:
          type: integer
          minimum: 0
        pendentesInformacao:
          type: integer
          minimum: 0
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [referenceDate, timezone, alertWindows, counts]
      properties:
        referenceDate:
          type: string
          format: date
        timezone:
          type: string
          example: America/Sao_Paulo
        alertWindows:
          type: object
          additionalProperties: false
          required: [nearDays, attentionDays]
          properties:
            nearDays:
              type: integer
              description: Limite inclusive da faixa próxima. Proposta 5.
              example: 5
            attentionDays:
              type: integer
              description: Limite inclusive da faixa de atenção. Proposta 15.
              example: 15
        counts:
          $ref: "#/components/schemas/DashboardCounts"
    PriorityPatient:
      type: object
      additionalProperties: false
      required: [id, fullName, nearestExpiryOn, alertBand, daysUntilExpiry]
      properties:
        id:
          type: string
          description: Inteiro do banco em texto decimal. Não é UUID.
          pattern: '^[1-9][0-9]*$'
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        nearestExpiryOn:
          type: string
          format: date
        alertBand:
          $ref: "#/components/schemas/AlertBand"
        daysUntilExpiry:
          type: integer
    PriorityPatientList:
      type: object
      additionalProperties: false
      required: [data, page, pageSize, total, referenceDate, timezone]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PriorityPatient"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          minimum: 0
        referenceDate:
          type: string
          format: date
        timezone:
          type: string
    CepLookup:
      type: object
      additionalProperties: false
      required: [postalCode, street, neighborhood, city, state]
      properties:
        postalCode:
          type: string
        street:
          type: string
        complement:
          type: string
          nullable: true
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
