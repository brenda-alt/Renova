      properties:
        expiresOn:
          type: string
          format: date
          nullable: true
          description: Null limpa o vencimento e marca a receita como pendente de informação.
        notes:
          type: string
          nullable: true
          maxLength: 2000
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
    PrescriptionList:
      type: object
      additionalProperties: false
      required: [data, page, pageSize, total, referenceDate, timezone]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Prescription"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          minimum: 0
        referenceDate:
          type: string
          format: date
        timezone:
          type: string
    DashboardCounts:
