        dosage:
          type: string
          minLength: 1
          maxLength: 80
        quantity:
          type: string
          minLength: 1
          maxLength: 40
        morning:
          type: boolean
        afternoon:
          type: boolean
        night:
          type: boolean
    PrescriptionMedication:
      type: object
      additionalProperties: false
      required: [id, medicationName, dosage, quantity, morning, afternoon, night]
      properties:
        id:
          type: string
          description: Inteiro do banco em texto decimal. Não é UUID.
          pattern: '^[1-9][0-9]*$'
        medicationName:
          type: string
        dosage:
          type: string
        quantity:
          type: string
        morning:
          type: boolean
        afternoon:
          type: boolean
        night:
          type: boolean
    PrescriptionUpdateRequest:
      type: object
      additionalProperties: false
